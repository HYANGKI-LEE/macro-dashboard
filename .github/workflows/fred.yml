name: Update FRED data

on:
  schedule:
    - cron: '0 22 * * *'  # 매일 07:00 KST
  workflow_dispatch:      # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: fred-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Build data/fred.json
        run: python scripts/fred/build_fred.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/fred.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update FRED data (auto)"
          git pull --rebase origin main
          git push
